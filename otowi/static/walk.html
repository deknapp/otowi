<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otowi — walking and cycling in Santa Fe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(18, 22, 29, 0.94);
    --border: #2b3340;
    --text: #e7ecf3;
    --muted: #93a1b4;
    --accent: #6ea8fe;
    --foot: #f0a35e;
    --bike: #5dd6c0;
    --dark: #7f9ddb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }

  .panel {
    position: absolute; z-index: 500;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #controls { top: 14px; left: 14px; width: 320px; max-height: calc(100% - 28px); overflow-y: auto; }
  #detail { bottom: 14px; right: 14px; width: 264px; display: none; }
  #layers { top: 14px; right: 14px; width: 178px; padding: 11px 12px; }

  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .3px; }
  h2 { font-size: 13px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 12px; }
  .rule { height: 1px; background: var(--border); margin: 14px 0 12px; }
  .sectiontitle { font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
                  color: var(--muted); margin-bottom: 7px; }

  .modes { display: flex; gap: 5px; margin-bottom: 12px; }
  .modes button {
    flex: 1; padding: 7px 4px; font-size: 11.5px; cursor: pointer;
    background: #182029; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; font-family: inherit; transition: all .12s;
  }
  .modes button:hover { color: var(--text); border-color: #3d4759; }
  .modes button.on { background: var(--accent); border-color: var(--accent); color: #0b1017; font-weight: 600; }
  .modes button.on.foot { background: var(--foot); border-color: var(--foot); }
  .modes button.on.bike { background: var(--bike); border-color: var(--bike); }

  .explain {
    font-size: 11.5px; color: var(--muted); margin-bottom: 12px;
    padding: 9px 10px; background: #141a22; border-left: 2px solid var(--accent);
    border-radius: 0 5px 5px 0;
  }
  .explain b { color: var(--text); font-weight: 600; }

  .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 4px; }
  .fig { background: #131a22; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; }
  .fig .n { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fig .l { font-size: 10.5px; color: var(--muted); line-height: 1.3; }

  /* The clock. 24 stacked columns, each split by what the light was doing. */
  #clock { display: flex; align-items: flex-end; gap: 1px; height: 76px; margin: 6px 0 2px; }
  #clock .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
                min-height: 1px; cursor: pointer; position: relative; border-radius: 1px 1px 0 0;
                overflow: hidden; }
  #clock .col.dim { opacity: .3; }
  #clock .col.sel { outline: 1px solid var(--text); outline-offset: 1px; }
  #clock .seg { width: 100%; }
  .clockax { display: flex; font-size: 9.5px; color: var(--muted); }
  .clockax span { flex: 1; text-align: center; }
  .clockax span:nth-child(even) { visibility: hidden; }

  .scrub { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); }
  .scrub button {
    width: 30px; height: 26px; cursor: pointer; background: #182029; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-family: inherit;
  }
  .scrub .t { width: 62px; font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--muted); }

  .keyrow { display: flex; flex-wrap: wrap; gap: 9px; font-size: 10.5px; color: var(--muted); margin-top: 6px; }
  .keyrow i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* The crossing-distance comparison: three bars on one scale. */
  .cmp { margin-top: 4px; }
  .cmp .row { display: grid; grid-template-columns: 96px 1fr 44px; gap: 7px; align-items: center; margin-bottom: 5px; }
  .cmp .lab { font-size: 10.5px; color: var(--muted); line-height: 1.25; }
  .cmp .track { height: 13px; background: #131a22; border-radius: 3px; overflow: hidden; }
  .cmp .fill { height: 100%; border-radius: 3px; }
  .cmp .v { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 10px;
       letter-spacing: .05em; text-transform: uppercase; padding-bottom: 4px; }
  td { padding: 3px 0; border-top: 1px solid #1c232d; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hot td { color: var(--foot); }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { color: var(--text); }

  .toggle { display: flex; align-items: center; gap: 7px; font-size: 11.5px;
            color: var(--muted); cursor: pointer; padding: 3px 0; }
  .toggle input { accent-color: var(--accent); }
  .swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

  .note { font-size: 10.5px; color: var(--muted); line-height: 1.45; margin-top: 10px; }
  a { color: var(--accent); }

  @media (max-width: 680px) {
    #controls { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 60%;
                border-radius: 12px 12px 0 0; border-left: 0; border-right: 0; border-bottom: 0; }
    #layers { width: 150px; }
    #detail { bottom: auto; top: 200px; right: 10px; left: 10px; width: auto; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <h1>otowi &middot; on foot, on a bike</h1>
  <div class="sub" id="lead">Santa Fe</div>

  <div class="modes">
    <button data-mode="foot" class="on foot">Walking</button>
    <button data-mode="bike">Cycling</button>
    <button data-mode="all">Both</button>
  </div>

  <div class="explain" id="explain"></div>

  <div class="figs" id="figs"></div>

  <div class="rule"></div>
  <div class="sectiontitle">When, and what the light was doing</div>
  <div id="clock"></div>
  <div class="clockax" id="clockax"></div>
  <div class="scrub">
    <button id="play">&#9654;</button>
    <input id="hour" type="range" min="-1" max="23" value="-1">
    <span class="t" id="hourlab">all day</span>
  </div>
  <div class="keyrow">
    <span><i style="background:#e9d8a6"></i>daylight</span>
    <span><i style="background:#7f9ddb"></i>dark, lit</span>
    <span><i style="background:#3c4a6b"></i>dark, unlit</span>
    <span><i style="background:#c9a227"></i>dusk or dawn</span>
  </div>
  <div class="note" id="clocknote"></div>

  <div class="rule"></div>
  <div class="sectiontitle">How far from a marked crossing</div>
  <div class="cmp" id="cmp"></div>
  <div class="note" id="cmpnote"></div>

  <div class="rule"></div>
  <div class="sectiontitle">The state's High Injury Network, here</div>
  <table id="corridors"></table>
  <div class="note" id="foot"></div>
</div>

<div id="layers" class="panel">
  <div class="sectiontitle" style="margin-bottom:6px">On the map</div>
  <label class="toggle"><input type="checkbox" id="t-hin" checked>
    <span><span class="swatch" style="background:#c0392b"></span> injury network</span></label>
  <label class="toggle"><input type="checkbox" id="t-crash" checked>
    <span>crashes</span></label>
  <label class="toggle"><input type="checkbox" id="t-cross">
    <span><span class="swatch" style="background:#e7ecf3"></span> crossings</span></label>
  <label class="toggle"><input type="checkbox" id="t-bike">
    <span><span class="swatch" style="background:#5dd6c0"></span> bike lanes</span></label>
  <label class="toggle"><input type="checkbox" id="t-walk">
    <span><span class="swatch" style="background:#8fa3bd"></span> sidewalks</span></label>
</div>

<div id="detail" class="panel">
  <h2 id="d-title">&mdash;</h2>
  <div class="sub" id="d-where" style="margin-bottom:8px"></div>
  <table id="d-table"></table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  var STATIC = !!window.OTOWI_STATIC;
  var DATA = STATIC ? "data/" : "/";

  var LIGHT = ["#e9d8a6", "#7f9ddb", "#3c4a6b", "#c9a227", "#5b6676"];
  var LIGHT_NAME = ["daylight", "dark, street lit", "dark, unlit", "dusk or dawn", "not recorded"];
  var SEV_NAME = { K: "killed", A: "serious injury", B: "minor injury",
                   C: "possible injury", O: "no injury" };
  // Radius in pixels. Severity is the only thing that changes the size,
  // because it is the only thing that changes what happened to the person.
  var SEV_R = { K: 7.5, A: 5.5, B: 3.8, C: 3.2, O: 2.8 };

  var map = L.map("map", { zoomControl: false, preferCanvas: true });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.control.scale({ imperial: true, metric: true }).addTo(map);

  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    { attribution: '&copy; Esri &middot; crashes, crossings, sidewalks and the High Injury Network: NM Dept. of Transportation, Vulnerable Road User Safety Assessment',
      maxZoom: 19 }
  ).addTo(map);
  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, pane: "shadowPane", opacity: 0.85 }
  ).addTo(map);

  var panes = {};
  ["assets", "hin", "crashes"].forEach(function (name, i) {
    map.createPane(name);
    map.getPane(name).style.zIndex = 420 + i * 10;
    panes[name] = name;
  });

  var D = null;            // the bundle
  var mode = "foot";       // foot | bike | all
  var hour = -1;           // -1 is the whole day
  var playing = null;

  var groups = {
    hin: L.layerGroup([]), crash: L.layerGroup([]),
    cross: L.layerGroup([]), bike: L.layerGroup([]), walk: L.layerGroup([])
  };

  // The bounding box holds every crash, and a handful of them are fifteen
  // miles down the Turquoise Trail. Opening on the full extent makes the city
  // -- where all but a few of them are -- a smudge. Opening on the middle 90%
  // of the points puts the streets being discussed on the screen, and the
  // outliers are still there to be panned to.
  function coreBounds(rows) {
    var lons = rows.map(function (c) { return c[0]; }).sort(function (a, b) { return a - b; });
    var lats = rows.map(function (c) { return c[1]; }).sort(function (a, b) { return a - b; });
    function at(arr, f) { return arr[Math.min(arr.length - 1, Math.floor(arr.length * f))]; }
    return L.latLngBounds([at(lats, 0.05), at(lons, 0.05)], [at(lats, 0.95), at(lons, 0.95)]);
  }

  // The controls sit over the map on a desktop, so the fit has to leave room
  // for them or the densest part of the city lands underneath the panel.
  function padded() {
    var wide = window.innerWidth > 680;
    return wide ? { paddingTopLeft: [350, 24], paddingBottomRight: [200, 24] }
                : { padding: [20, 20] };
  }

  function el(id) { return document.getElementById(id); }
  function pct(x) { return Math.round(x * 100) + "%"; }

  // ------------------------------------------------------------------ drawing

  function modeMatches(c) {
    // c[4] is 0 for somebody on foot and 1 for somebody on a bike.
    return mode === "all" || (mode === "foot" ? c[4] === 0 : c[4] === 1);
  }

  function visible() {
    return D.crashes.filter(function (c) {
      return modeMatches(c) && (hour < 0 || c[2] === hour);
    });
  }

  function colourFor(c) { return c[4] === 0 ? "#f0a35e" : "#5dd6c0"; }

  function drawCrashes() {
    groups.crash.clearLayers();
    var rows = visible();
    rows.forEach(function (c) {
      var dark = c[5] === 1 || c[5] === 2;
      var marker = L.circleMarker([c[1], c[0]], {
        pane: "crashes",
        radius: SEV_R[c[3]] || 3,
        color: dark ? LIGHT[c[5]] : "#0e1116",
        weight: dark ? 1.6 : 0.8,
        opacity: 0.95,
        fillColor: colourFor(c),
        // The ones that killed or maimed somebody are solid; the rest are
        // translucent, so a dense arterial still reads as a line of points
        // rather than a smear and the severe ones come through it.
        fillOpacity: (c[3] === "K" || c[3] === "A") ? 0.95 : 0.45
      });
      marker.on("click", function () { showCrash(c); });
      groups.crash.addLayer(marker);
    });
  }

  function hinColour(r) {
    // Killed-and-seriously-hurt per mile, not the raw count: a long corridor
    // accumulates crashes for being long.
    var v = Math.min(1, r / 8);
    var stops = ["#4a5a3a", "#8a7a24", "#c07a28", "#c0392b", "#8e1b18"];
    var i = Math.min(stops.length - 2, Math.floor(v * (stops.length - 1)));
    return mix(stops[i], stops[i + 1], v * (stops.length - 1) - i);
  }

  function mix(a, b, t) {
    function p(h) { return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
    var x = p(a), y = p(b);
    return "rgb(" + x.map(function (v, i) { return Math.round(v + (y[i]-v)*t); }).join(",") + ")";
  }

  function drawHin() {
    groups.hin.clearLayers();
    D.corridors.forEach(function (c) {
      var perMile = c.miles > 0 ? c.ksi / c.miles : 0;
      c.paths.forEach(function (path) {
        var line = L.polyline(path.map(function (p) { return [p[1], p[0]]; }), {
          pane: "hin",
          color: hinColour(perMile),
          weight: Math.max(3, Math.min(11, 3 + Math.sqrt(c.index) / 2.2)),
          opacity: 0.7, lineCap: "round"
        });
        line.on("click", function (e) { L.DomEvent.stop(e); showCorridor(c); });
        groups.hin.addLayer(line);
      });
    });
  }

  function drawAssets() {
    [["crosswalk", groups.cross, "#e7ecf3", 2.2, 0.85],
     ["bike_lane", groups.bike, "#5dd6c0", 2.0, 0.7],
     ["sidewalk", groups.walk, "#8fa3bd", 1.3, 0.42]].forEach(function (spec) {
      var lines = D.assets[spec[0]] || [];
      spec[1].clearLayers();
      lines.forEach(function (path) {
        spec[1].addLayer(L.polyline(path.map(function (p) { return [p[1], p[0]]; }), {
          pane: "assets", color: spec[2], weight: spec[3], opacity: spec[4]
        }));
      });
    });
  }

  // --------------------------------------------------------------- the clock

  function clockData() {
    // Counts per hour for the selected mode, split by lighting. by_light is
    // for everybody; when one mode is selected the split is recomputed from
    // the crash rows so the columns always sum to what the map is showing.
    var out = [];
    for (var h = 0; h < 24; h++) out.push([0, 0, 0, 0, 0]);
    D.crashes.forEach(function (c) {
      if (!modeMatches(c) || c[2] < 0) return;
      out[c[2]][c[5]]++;
    });
    return out;
  }

  function drawClock() {
    var data = clockData();
    var max = Math.max.apply(null, data.map(function (col) {
      return col.reduce(function (a, b) { return a + b; }, 0);
    })) || 1;

    var html = "";
    for (var h = 0; h < 24; h++) {
      var total = data[h].reduce(function (a, b) { return a + b; }, 0);
      var height = Math.max(1, Math.round(total / max * 74));
      var segs = "";
      // Daylight at the bottom, darkness stacked on top, so the evening
      // columns visibly fill with night while they are still tall.
      [0, 3, 1, 2, 4].forEach(function (code) {
        if (!data[h][code]) return;
        segs += '<div class="seg" style="height:' + (data[h][code] / total * 100) +
                '%;background:' + LIGHT[code] + '"></div>';
      });
      html += '<div class="col' + (hour >= 0 && hour !== h ? " dim" : "") +
              (hour === h ? " sel" : "") + '" data-h="' + h +
              '" style="height:' + height + 'px" title="' + h + ':00 — ' + total + '">' +
              segs + "</div>";
    }
    el("clock").innerHTML = html;
    Array.prototype.forEach.call(el("clock").children, function (node) {
      node.onclick = function () { setHour(+node.dataset.h === hour ? -1 : +node.dataset.h); };
    });

    var ax = "";
    for (var a = 0; a < 24; a++) ax += "<span>" + (a % 6 === 0 ? a : "") + "</span>";
    el("clockax").innerHTML = ax;

    // The sentence under the clock, computed rather than written, so it
    // cannot drift away from the data when the mode changes.
    var dark = 0, total = 0, evening = 0;
    for (var k = 0; k < 24; k++) {
      var sum = data[k].reduce(function (x, y) { return x + y; }, 0);
      total += sum;
      dark += data[k][1] + data[k][2];
      if (k >= 17 && k <= 22) evening += sum;
    }
    el("clocknote").innerHTML =
      "<b>" + pct(evening / (total || 1)) + "</b> of these happen between 17:00 and 23:00, " +
      "and " + pct(dark / (total || 1)) + " of them in the dark. That is not when drivers " +
      "crash and not when the roads are empty — it is when the light goes and people are " +
      "still out.";
  }

  function setHour(h) {
    hour = h;
    el("hour").value = h;
    el("hourlab").textContent = h < 0 ? "all day" :
      (h < 10 ? "0" : "") + h + ":00–" + (h < 9 ? "0" : "") + (h + 1) + ":00";
    drawClock();
    drawCrashes();
  }

  // ------------------------------------------------------- the other panels

  function drawFigures() {
    var rows = D.crashes.filter(modeMatches);
    var killed = rows.filter(function (c) { return c[3] === "K"; });
    var ksi = rows.filter(function (c) { return c[3] === "K" || c[3] === "A"; });
    var darkKilled = killed.filter(function (c) { return c[5] === 1 || c[5] === 2; });
    var who = mode === "bike" ? "cyclists" : mode === "foot" ? "people on foot" : "people";

    el("figs").innerHTML = [
      [rows.length, "struck by a vehicle, " + D.years[0] + "–" + D.years[1]],
      [killed.length, "killed"],
      [ksi.length, "killed or seriously hurt"],
      [killed.length ? pct(darkKilled.length / killed.length) : "—", "of the deaths were after dark"]
    ].map(function (f) {
      return '<div class="fig"><div class="n">' + f[0] + '</div><div class="l">' + f[1] + "</div></div>";
    }).join("");

    el("explain").innerHTML = mode === "bike"
      ? "Cyclists hit by a vehicle in Santa Fe. <b>" +
        pct(D.infrastructure.cyclists.no_bike_lane) + "</b> of them were more than 25 m " +
        "from the nearest inventoried bike lane — the median distance was " +
        D.infrastructure.cyclists.median_distance_m + " m."
      : mode === "foot"
      ? "Every pedestrian struck by a vehicle here, with a coordinate on each. " +
        "Size is what happened to the person; colour is whether they were walking " +
        "or riding; a pale ring means it was dark."
      : "Everybody hit by a vehicle in Santa Fe while not inside one. " +
        who + ", " + D.years[0] + " to " + D.years[1] + ".";
  }

  function drawComparison() {
    var c = D.crossings;
    var rows = [
      ["a random spot on these roads", c.road_itself, "#5b6676"],
      ["a pedestrian who was hit", c.pedestrian_hit, "#f0a35e"],
      ["a pedestrian killed or maimed", c.pedestrian_killed_or_serious, "#c0392b"]
    ];
    var max = Math.max.apply(null, rows.map(function (r) { return r[1].median_m || 0; })) || 1;
    el("cmp").innerHTML = rows.map(function (r) {
      return '<div class="row"><div class="lab">' + r[0] + "</div>" +
             '<div class="track"><div class="fill" style="width:' +
             (r[1].median_m / max * 100) + "%;background:" + r[2] + '"></div></div>' +
             '<div class="v">' + r[1].median_m + " m</div></div>";
    }).join("");

    el("cmpnote").innerHTML =
      "Median distance to the nearest marked crossing. Pedestrians are <b>not</b> " +
      "being hit away from the crossings — they are hit " +
      Math.round(c.road_itself.median_m / c.pedestrian_hit.median_m) +
      "&times; closer to one than the average spot on the same road. But the crashes " +
      "that kill or maim are twice as likely to be the far-from-a-crossing ones (" +
      pct(c.pedestrian_killed_or_serious.share_over_100m) + " over 100 m, against " +
      pct(c.pedestrian_hit.share_over_100m) + " of all of them). Two problems, two fixes. " +
      "Nobody counts how many people cross where, so this is a distribution and not a cause.";
  }

  function drawCorridors() {
    var rows = D.by_corridor.filter(function (r) { return r.crashes > 0; }).slice(0, 8);
    var html = "<tr><th>road</th><th class='n'>crashes</th><th class='n'>KSI</th>" +
               "<th class='n'>per mile</th></tr>";
    rows.forEach(function (r, i) {
      html += "<tr class='pick" + (i === 0 ? " hot" : "") + "' data-name=\"" +
              r.name.replace(/"/g, "") + "\"><td>" + r.name + "</td><td class='n'>" +
              r.crashes + "</td><td class='n'>" + r.killed_or_serious +
              "</td><td class='n'>" + r.ksi_per_mile + "</td></tr>";
    });
    el("corridors").innerHTML = html;
    Array.prototype.forEach.call(el("corridors").querySelectorAll("tr.pick"), function (tr) {
      tr.onclick = function () {
        var c = D.corridors.filter(function (x) { return x.name === tr.dataset.name; })[0];
        if (c) { showCorridor(c); zoomTo(c); }
      };
    });

    el("foot").innerHTML =
      "Ranked by NMDOT's own crash severity index, which the state built from the " +
      "state's crash file without reference to anything here. It puts Cerrillos Road " +
      "first, and so does NHTSA's fatal-crash census counting only deaths. " +
      "<a href='" + (STATIC ? "index.html" : "/") + "'>The driving map is here.</a>";
  }

  function zoomTo(c) {
    var pts = [];
    c.paths.forEach(function (p) { p.forEach(function (q) { pts.push([q[1], q[0]]); }); });
    if (pts.length) map.fitBounds(L.latLngBounds(pts), padded());
  }

  function showCrash(c) {
    el("d-title").textContent = (c[4] === 0 ? "Pedestrian" : "Cyclist") + " — " +
      (SEV_NAME[c[3]] || c[3]);
    el("d-where").textContent = (c[7] || "street not recorded") + ", " + c[6];
    var rows = [
      ["time of day", c[2] < 0 ? "not recorded" : ((c[2] < 10 ? "0" : "") + c[2] + ":00")],
      ["light", LIGHT_NAME[c[5]]],
      ["nearest marked crossing", c[8] < 0 ? "none inventoried near by" : c[8] + " m"]
    ];
    el("d-table").innerHTML = rows.map(function (r) {
      return "<tr><td>" + r[0] + "</td><td class='n'>" + r[1] + "</td></tr>";
    }).join("");
    el("detail").style.display = "block";
  }

  function showCorridor(c) {
    el("d-title").textContent = c.name;
    el("d-where").textContent = "High Injury Network — NMDOT's own ranking";
    var rows = [
      ["crash severity index", c.index],
      ["pedestrian &amp; cyclist crashes", c.vru],
      ["killed or seriously hurt", c.ksi],
      ["pedestrian fatal or serious", c.ped_ka],
      ["length", c.miles + " mi"],
      ["vehicles a day", c.aadt ? c.aadt.toLocaleString() : "not published"],
      ["speed limit", c.speed ? c.speed + " mph" : "not published"],
      ["lanes", c.lanes || "not published"]
    ];
    el("d-table").innerHTML = rows.map(function (r) {
      return "<tr><td>" + r[0] + "</td><td class='n'>" + r[1] + "</td></tr>";
    }).join("");
    el("detail").style.display = "block";
  }

  // ------------------------------------------------------------------ wiring

  Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (o) {
        o.className = "";
      });
      b.className = "on " + (b.dataset.mode === "foot" ? "foot" : b.dataset.mode === "bike" ? "bike" : "");
      mode = b.dataset.mode;
      drawFigures(); drawClock(); drawCrashes();
    };
  });

  el("hour").oninput = function () { stop(); setHour(+this.value); };
  el("play").onclick = function () { playing ? stop() : start(); };

  function start() {
    if (hour < 0) setHour(0);
    el("play").innerHTML = "&#10074;&#10074;";
    playing = setInterval(function () { setHour((hour + 1) % 24); }, 620);
  }
  function stop() {
    if (playing) { clearInterval(playing); playing = null; }
    el("play").innerHTML = "&#9654;";
  }

  [["t-hin", "hin"], ["t-crash", "crash"], ["t-cross", "cross"],
   ["t-bike", "bike"], ["t-walk", "walk"]].forEach(function (spec) {
    el(spec[0]).onchange = function () {
      if (this.checked) groups[spec[1]].addTo(map); else map.removeLayer(groups[spec[1]]);
    };
  });

  map.on("click", function () { el("detail").style.display = "none"; });

  fetch(DATA + "walk.json").then(function (r) { return r.json(); }).then(function (d) {
    D = d;
    map.fitBounds(coreBounds(d.crashes), padded());
    el("lead").innerHTML = "Santa Fe &middot; " + d.summary.crashes +
      " people struck while walking or riding, " + d.years[0] + "–" + d.years[1] +
      " &middot; NMDOT";

    drawAssets(); drawHin(); drawCrashes(); drawClock(); drawFigures();
    drawComparison(); drawCorridors();

    groups.hin.addTo(map);
    groups.crash.addTo(map);
  }).catch(function (e) {
    el("explain").textContent = "Could not load walk.json: " + e;
  });
})();
</script>
</body>
</html>
