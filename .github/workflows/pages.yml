name: pages

# Publishes site/ — the modelled morning peak and the calibration error, as
# static files. Nothing is computed at request time and nothing could be: a
# run of this model takes about an hour. `otowi export` regenerates site/.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on for the repository the first time this
      # runs. Without it the deploy fails with a bare 404 from the Pages API,
      # which reads like a broken workflow rather than an unset setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
