<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otowi — northern New Mexico morning peak</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(18, 22, 29, 0.94);
    --border: #2b3340;
    --text: #e7ecf3;
    --muted: #93a1b4;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }

  .panel {
    position: absolute;
    z-index: 500;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #controls { top: 14px; left: 14px; width: 288px; max-height: calc(100% - 28px); overflow-y: auto; }
  #detail   { bottom: 14px; right: 14px; width: 268px; display: none; }

  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 12px; }

  .whenrow { margin-top: 7px; }
  .whenrow label { color: var(--muted); font-size: 11.5px; }
  .whenrow input[type="time"] {
    flex: 1; min-width: 0; padding: 5px 6px; font: inherit; font-size: 11.5px;
    background: #182029; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .outside { opacity: .32; }

  #hours { display: flex; align-items: flex-end; gap: 1px; height: 54px; margin: 8px 0 4px; }
  #hours .h { flex: 1; background: #2f6b3a; border-radius: 1px 1px 0 0; min-height: 2px; position: relative; }
  #hours .h.bad { background: #c0392b; }
  #hours .h.mid { background: #c9a227; }
  .hourax { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  .prefrow { margin-top: 9px; }
  .preflabel { color: var(--muted); font-size: 11.5px; }
  .prefs { display: flex; gap: 5px; margin-top: 4px; }
  .prefs button {
    flex: 1; padding: 6px 4px; font-size: 11.5px; cursor: pointer;
    background: #182029; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .prefs button.on { background: var(--accent); border-color: var(--accent); color: #0b1017; font-weight: 600; }

  .picks { display: grid; gap: 6px; margin: 10px 0 4px; }
  .pick {
    display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center;
    padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px;
    background: #131a22;
  }
  .pick.chosen { border-color: var(--accent); background: #16222e; }
  .pick .tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pick.chosen .tag { color: var(--accent); font-weight: 700; }
  .pick .when { font-size: 15px; font-weight: 600; }
  .pick .detail { font-size: 11px; color: var(--muted); }
  .whatis { font-size: 11px; color: var(--muted); margin: 8px 0 2px; line-height: 1.45; }

  .barrow .rx { width: 42px; text-align: right; font-size: 11px; color: var(--muted); }
  .barrow .rx.hot { color: #e08e3c; font-weight: 600; }
  .footrow { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11.5px; color: var(--muted); cursor: pointer; }

  /* Phones. The controls are a fixed side panel on a desktop and a sheet at
     the bottom on a phone, because a 288px panel over a map on a 390px screen
     leaves no map. */
  @media (max-width: 620px) {
    #controls {
      top: auto; bottom: 0; left: 0; right: 0; width: auto;
      max-height: 62%; border-radius: 12px 12px 0 0;
      border-left: 0; border-right: 0; border-bottom: 0;
    }
    #detail { bottom: auto; top: 10px; right: 10px; left: 10px; width: auto; }
    .layers { flex-wrap: wrap; }
    .layers button { flex: 1 1 44%; padding: 9px 4px; font-size: 12.5px; }
    .odrow select, .whenrow input[type="time"] { font-size: 16px; }
    #hours { height: 44px; }
  }

  .layers { display: flex; gap: 5px; margin-bottom: 12px; }
  .layers button {
    flex: 1; padding: 7px 4px; font-size: 11.5px; cursor: pointer;
    background: #182029; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; transition: all .12s;
  }
  .layers button:hover { color: var(--text); border-color: #3d4759; }
  .layers button.on { background: var(--accent); border-color: var(--accent); color: #0b1017; font-weight: 600; }

  .explain {
    font-size: 11.5px; color: var(--muted); margin-bottom: 12px;
    padding: 9px 10px; background: #141a22; border-left: 2px solid var(--accent);
    border-radius: 0 5px 5px 0;
  }

  .legend { margin-bottom: 12px; }
  .legend .bar { height: 9px; border-radius: 5px; margin-bottom: 4px; }
  .legend .ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .muted td { color: var(--muted); font-weight: 400; }
  .rule { border-top: 1px solid var(--border); margin: 10px 0; }

  .warn {
    font-size: 11.5px; line-height: 1.5; color: #ffd7a8;
    background: rgba(180, 110, 30, .13); border: 1px solid rgba(210, 140, 50, .3);
    border-radius: 6px; padding: 9px 10px; margin-top: 10px;
  }
  .warn b { color: #ffc078; }

  .triptitle { font-weight: 600; margin-bottom: 8px; font-size: 12.5px; }
  .odrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .odrow select {
    flex: 1; min-width: 0; padding: 6px 7px; font-size: 11.5px;
    background: #182029; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; font-family: inherit;
  }
  .arrow { color: var(--muted); }
  #go {
    width: 100%; padding: 7px; font-size: 12px; cursor: pointer; font-family: inherit;
    background: var(--accent); color: #0b1017; font-weight: 600;
    border: none; border-radius: 6px;
  }
  #go:disabled { opacity: .55; cursor: default; }

  .bars { margin-top: 10px; }
  .barrow { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 11px; }
  .barrow .t { width: 36px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .barrow .b { height: 11px; border-radius: 3px; background: #2e6fb8; min-width: 2px; }
  .barrow .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  .barrow.best .b { background: #4ade80; }
  .barrow.best .t, .barrow.best .m { color: #86efac; font-weight: 600; }
  .verdict { margin-top: 9px; font-size: 11.5px; line-height: 1.5; }
  .verdict b { color: #86efac; }

  #detail h2 { font-size: 13px; margin: 0 0 8px; }
  #detail .road { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; word-break: break-word; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 10px; }
  .leaflet-container { background: var(--bg); }
  .leaflet-control-attribution { background: rgba(14,17,22,.8) !important; color: #6b7787 !important; }
  .leaflet-control-attribution a { color: #8b98aa !important; }
</style>
</head>
<body>
<script>window.OTOWI_STATIC = true;</script>

<div id="map"></div>

<div id="controls" class="panel">
  <h1>otowi</h1>
  <div class="sub">Northern New Mexico · where and when driving here kills people
    <span id="window"></span></div>

  <div class="layers">
    <button data-layer="risk" class="on">Risk</button>
    <button data-layer="modelled">Traffic</button>
    <button data-layer="observed">Counted</button>
    <button data-layer="ratio">Coverage</button>
  </div>

  <div class="explain" id="explain"></div>

  <div id="riskpanel" style="display:none">
    <div class="rule"></div>
    <div class="triptitle">When, not just where</div>
    <div class="sub" id="hourlead"></div>
    <div id="hours"></div>
    <label class="footrow"><input type="checkbox" id="footonly">
      <span id="footlabel">Only people on foot or bike</span></label>
  </div>

  <div class="legend">
    <div class="bar" id="legend-bar"></div>
    <div class="ends"><span id="legend-lo"></span><span id="legend-hi"></span></div>
  </div>

  <div class="rule"></div>

  <div class="trip">
    <div class="triptitle">When should I leave?</div>
    <div class="odrow">
      <select id="from"></select>
      <span class="arrow">&rarr;</span>
      <select id="to"></select>
    </div>
    <div class="odrow whenrow">
      <label for="after">between</label>
      <input id="after" type="time" step="900" value="06:00">
      <span class="arrow">&ndash;</span>
      <input id="before" type="time" step="900" value="09:00">
    </div>
    <div class="prefrow">
      <span class="preflabel">What matters</span>
      <div class="prefs">
        <button data-pref="both" class="on">Both</button>
        <button data-pref="speed">Speed</button>
        <button data-pref="safety">Safety</button>
      </div>
    </div>
    <button id="go">Check departure times</button>
    <div id="trip-out"></div>
  </div>

  <div class="rule"></div>

  <table id="stats"></table>

  <div class="hint">Click any road for its numbers.</div>
</div>

<div id="detail" class="panel">
  <h2 id="d-name">—</h2>
  <div class="road" id="d-road"></div>
  <table id="d-table"></table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  var map = L.map("map", { preferCanvas: true, zoomControl: false })
             .setView([35.85, -106.10], 10);

  // Zoom on the right: the controls panel occupies the top left.
  L.control.zoom({ position: "topright" }).addTo(map);

  // Esri's dark canvas, which needs no key. CARTO's dark tiles were used here
  // first and now watermark every tile with "API KEY REQUIRED", which is worth
  // knowing before reaching for them again.
  //
  // The basemap is a nicety, not a dependency: the road network is the map. If
  // the tiles never load the page is still completely usable.
  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: '&copy; Esri · traffic counts: NM Dept. of Transportation · commute flows: US Census LODES · departure times: American Community Survey · crashes: NHTSA',
      maxZoom: 16
    }
  ).addTo(map);

  // Place names ship as a separate transparent layer on this basemap. Without
  // it the map is a beautiful abstract and you cannot tell Santa Fe from
  // Espanola, which is most of the point.
  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 16, pane: "shadowPane", opacity: 0.85 }
  ).addTo(map);

  var LAYERS = {
    modelled: {
      label: "Simulated vehicles per hour",
      explain: "What the simulation put on each road. Commute trips only, so it is well below real traffic — see the Ratio tab.",
      lo: "0", hi: "1500+",
      gradient: ["#10233b", "#1c4a7a", "#2e86c1", "#5dade2", "#a9d6f5"],
      value: function (p) { return p.modelled; },
      color: function (p) { return ramp(p.modelled / 1500); },
      has:   function ()  { return true; }
    },
    observed: {
      label: "Counted vehicles per hour",
      explain: "What the New Mexico Dept. of Transportation actually counted, converted to one direction of the busiest hour. Only state highways are counted.",
      lo: "0", hi: "1500+",
      gradient: ["#2b1a10", "#6b3a12", "#b45f1a", "#e08e3c", "#f7c98b"],
      value: function (p) { return p.observed; },
      color: function (p) { return ramp2(p.observed / 1500); },
      has:   function (p) { return p.observed != null; }
    },
    risk: {
      label: "Deaths per billion km driven",
      explain: "Fatal crashes NHTSA recorded here, divided by the travel that produced them. Points are the crashes; colour is the corridor's rate. The US average is about 7.",
      lo: "0", hi: "20+",
      gradient: ["#1b3a2a", "#2f6b3a", "#c9a227", "#d9743a", "#c0392b"],
      value: function (p) { return p.risk; },
      color: function (p) { return scale(LAYERS.risk.gradient, Math.min(1, p.risk / 20)); },
      // Only corridors NMDOT counts get a rate, which is most of the deaths'
      // roads and a small share of the network. Drawing the rest in this view
      // would imply they had been assessed and found safe.
      has:   function (p) { return p.risk != null; },
      points: true
    },
    ratio: {
      label: "Share of real traffic explained",
      explain: "How much of the real traffic the simulation accounts for. Red is far too little; grey would be a match. Almost nothing is grey.",
      lo: "0 (nothing modelled)", hi: "1+ (matches)",
      gradient: ["#7a1420", "#c0392b", "#e67e22", "#95a5a6", "#dfe6e9"],
      value: function (p) { return p.ratio; },
      color: function (p) { return ratioColor(p.ratio); },
      has:   function (p) { return p.ratio != null; }
    }
  };

  function lerp(a, b, t) { return a + (b - a) * t; }

  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function scale(stops, t) {
    t = Math.max(0, Math.min(1, t));
    var pos = t * (stops.length - 1);
    var i = Math.min(stops.length - 2, Math.floor(pos));
    var f = pos - i;
    var a = hexToRgb(stops[i]), b = hexToRgb(stops[i + 1]);
    return "rgb(" + Math.round(lerp(a[0], b[0], f)) + "," +
                    Math.round(lerp(a[1], b[1], f)) + "," +
                    Math.round(lerp(a[2], b[2], f)) + ")";
  }

  // Square root, not linear: volumes are heavily skewed and a linear ramp
  // leaves every road but the interstate at the bottom of the scale.
  function ramp(t)  { return scale(LAYERS.modelled.gradient, Math.sqrt(Math.max(0, t))); }
  function ramp2(t) { return scale(LAYERS.observed.gradient, Math.sqrt(Math.max(0, t))); }
  function ratioColor(r) { return scale(LAYERS.ratio.gradient, Math.min(1, r) ); }

  function width(p, key) {
    var v = key === "observed" ? (p.observed || 0) : (p.modelled || 0);
    return Math.max(1.1, Math.min(7, Math.sqrt(v) / 7));
  }

  // Opens on risk, not on the simulation. The modelled layer's honest caption
  // is "this is 14% of reality"; the risk layer is measured, and it is the
  // thing a person opening this page has a reason to care about.
  var current = "risk", geo = null, layer = null;
  var risk = null, crashLayer = null, footOnly = false;

  // Risk is loaded separately: 147 points against 8,000 lines, on a different
  // cadence, and a reader looking at traffic volumes should not pay for it.
  function loadRisk() {
    if (risk !== null) { return Promise.resolve(risk); }
    return fetch(DATA + "risk.json")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        risk = d || false;
        if (!risk) { return risk; }
        // Attach each edge's corridor rate to its properties, so the layer
        // spec can read it like any other value.
        geo.features.forEach(function (f) {
          var id = String(f.properties.id).replace(/^-/, "");
          var corridor = risk.corridor_of[id];
          var r = corridor && risk.corridors[corridor];
          if (r && r.rankable) {
            f.properties.risk = r.lower_bound;
            f.properties.risk_rate = r.per_billion_veh_km;
            f.properties.risk_road = r.name;
            f.properties.risk_deaths = r.fatalities;
            f.properties.risk_km = r.length_km;
          }
        });
        return risk;
      })
      .catch(function () { risk = false; return risk; });
  }

  function drawCrashes(show) {
    if (crashLayer) { map.removeLayer(crashLayer); crashLayer = null; }
    if (!show || !risk || !risk.crashes) { return; }
    var shown = risk.crashes.filter(function (c) {
      return !footOnly || c.foot;
    });
    crashLayer = L.layerGroup(shown.map(function (c) {
      return L.circleMarker([c.lat, c.lon], {
        radius: 3 + Math.min(4, c.n),
        color: c.dark ? "#f0c674" : "#e8e8e8",
        weight: 1.2,
        // People on foot are a different problem with different fixes, so
        // they are a different colour rather than an average.
        fillColor: c.foot ? "#8e6bc7" : "#c0392b",
        fillOpacity: 0.85
      }).bindTooltip(
        (c.foot ? "On foot or bike &middot; " : "") +
        c.n + (c.n === 1 ? " death" : " deaths") + " &middot; " + c.year +
        (c.road ? " &middot; " + c.road : "") +
        (c.hour != null ? " &middot; " + String(c.hour).padStart(2, "0") + ":00" : "") +
        (c.dark ? " &middot; after dark" : ""));
    })).addTo(map);
  }

  function draw() {
    var spec = LAYERS[current];
    if (spec.points && risk === null) {
      // First time on this tab: fetch, then draw once for real.
      loadRisk().then(draw);
      return;
    }
    if (layer) { map.removeLayer(layer); }
    drawCrashes(!!spec.points);

    layer = L.geoJSON(geo, {
      filter: function (f) { return spec.has(f.properties); },
      style: function (f) {
        return {
          color: spec.color(f.properties),
          weight: width(f.properties, current),
          opacity: 0.88
        };
      },
      onEachFeature: function (f, lyr) {
        lyr.on("click", function (e) { showDetail(f.properties); L.DomEvent.stop(e); });
      }
    }).addTo(map);

    var explain = spec.explain;
    if (spec.points && risk && risk.summary) {
      var sm = risk.summary;
      explain += " " + sm.fatalities + " deaths in " + sm.crashes +
        " crashes; only " + Math.round(sm.share_of_deaths_ranked * 100) +
        "% are on roads with a measured traffic count, which is what a rate " +
        "needs. The rest are shown as points and not ranked.";
    } else if (spec.points && risk === false) {
      explain = "Crash data unavailable in this export.";
    }
    document.getElementById("explain").textContent = explain;
    renderRisk(!!spec.points);
    document.getElementById("legend-bar").style.background =
      "linear-gradient(90deg," + spec.gradient.join(",") + ")";
    document.getElementById("legend-lo").textContent = spec.lo;
    document.getElementById("legend-hi").textContent = spec.hi;
  }

  function renderRisk(show) {
    var panel = document.getElementById("riskpanel");
    panel.style.display = (show && risk && risk.summary) ? "block" : "none";
    if (!show || !risk || !risk.summary) { return; }

    var rows = risk.summary.by_hour || [];
    if (!rows.length) { return; }
    var top = Math.max.apply(null, rows.map(function (r) { return r.relative_risk; }));
    var best = rows.reduce(function (a, b) { return b.relative_risk < a.relative_risk ? b : a; });
    var worst = rows.reduce(function (a, b) { return b.relative_risk > a.relative_risk ? b : a; });

    document.getElementById("hours").innerHTML = rows.map(function (r) {
      var cls = r.relative_risk >= 2 ? "bad" : (r.relative_risk >= 1 ? "mid" : "");
      return '<div class="h ' + cls + '" style="height:' +
        Math.max(4, Math.round(r.relative_risk / top * 100)) + '%" title="' +
        String(r.hour).padStart(2, "0") + ':00 — ' + r.relative_risk.toFixed(2) +
        '× an ordinary hour"></div>';
    }).join("") ;

    var ratio = best.relative_risk > 0
      ? Math.round(worst.relative_risk / best.relative_risk) : null;
    document.getElementById("hourlead").innerHTML =
      "Per kilometre driven. " + (ratio ? "Driving at <b>" +
      String(worst.hour).padStart(2, "0") + ":00</b> is about <b>" + ratio +
      "×</b> as likely to kill someone as driving at <b>" +
      String(best.hour).padStart(2, "0") + ":00</b> — the rush hour is the " +
      "safest time on these roads, not the worst." : "");

    var foot = risk.summary.on_foot || {};
    document.getElementById("footlabel").innerHTML =
      "Only people on foot or bike — <b>" + foot.deaths + "</b> of " +
      risk.summary.fatalities + " deaths, " +
      Math.round((foot.share_after_dark || 0) * 100) + "% after dark against " +
      Math.round((foot.vehicle_share_after_dark || 0) * 100) + "% for people in cars";
  }

  function row(label, value, muted) {
    return "<tr" + (muted ? ' class="muted"' : "") + "><td>" + label + "</td><td>" + value + "</td></tr>";
  }

  function num(v, digits) {
    if (v == null) { return "—"; }
    return v.toLocaleString(undefined, { maximumFractionDigits: digits == null ? 0 : digits });
  }

  function showDetail(p) {
    document.getElementById("d-name").textContent = p.name || "(unnamed road)";
    document.getElementById("d-road").textContent =
      (p.route ? "Route " + p.route + " · " : "") + "limit " + p.limit_kmh + " km/h";

    var html = row("Simulated vehicles/hour", num(p.modelled));
    if (p.observed != null) {
      html += row("Counted vehicles/hour", num(p.observed));
      html += row("Share explained", p.ratio != null ? Math.round(p.ratio*100) + "%" : "—");
      html += row("Vehicles per day, " + (p.aadt_year || "") + " count", num(p.aadt), true);
    } else {
      html += row("Counted", "no traffic count on this road", true);
    }
    if (p.risk != null) {
      html += row("Corridor", p.risk_road, true);
      html += row("Deaths per billion km",
                  p.risk_rate.toFixed(1) + " <span class='muted'>(" +
                  p.risk.toFixed(1) + " lower bound)</span>");
      html += row("Deaths on it", p.risk_deaths + " over " +
                  p.risk_km.toFixed(0) + " km, 6 years", true);
    }
    document.getElementById("d-table").innerHTML = html;
    document.getElementById("detail").style.display = "block";
  }

  document.getElementById("footonly").addEventListener("change", function (e) {
    footOnly = e.target.checked;
    drawCrashes(true);
  });

  map.on("click", function () { document.getElementById("detail").style.display = "none"; });

  Array.prototype.forEach.call(document.querySelectorAll(".layers button"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".layers button"),
        function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      current = btn.dataset.layer;
      draw();
    });
  });

  // `otowi web` serves the JSON from its own endpoints; the published page
  // (see `otowi export`) has the same files sitting in data/ beside it, and
  // a precomputed answer for every place pair instead of a live router.
  // One page, so the served version and the published one cannot drift.
  var STATIC = !!window.OTOWI_STATIC;
  var DATA = STATIC ? "data/" : "";

  fetch(DATA + "summary.json").then(function (r) { return r.json(); }).then(function (s) {
    document.getElementById("window").textContent = s.window || "";
    var held = s.held_out || {};

    document.getElementById("stats").innerHTML =
      row("Vehicles simulated", num(s.vehicles_loaded || s.vehicles_arrived)) +
      row("Roads with a traffic count", num(s.measured_links)) +
      '<tr><td colspan="2"><div class="rule"></div></td></tr>' +
      // "GEH" is not an acronym -- it is one traffic engineer's initials -- so
      // there is nothing to expand and no reason to put it in front of a
      // reader who is here to find out about their commute. The share of real
      // traffic the model explains says the same thing in words.
      row("Real traffic explained",
          held.median_ratio_modelled_over_observed != null
            ? Math.round(held.median_ratio_modelled_over_observed * 100) + "%" : "—") +
      row("Checked against roads it was not fitted on", "yes", true) +
      row("Average delay per trip", s.mean_time_loss_s != null
            ? Math.round(s.mean_time_loss_s / 60) + " min" : "—", true);
  });

  // ------------------------------------------------------- trip planner

  var fromSel = document.getElementById("from"),
      toSel   = document.getElementById("to"),
      goBtn   = document.getElementById("go"),
      afterInput  = document.getElementById("after"),
      beforeInput = document.getElementById("before"),
      tripOut = document.getElementById("trip-out"),
      lastPlan = null,
      pref = "both";

  // Speed / safety / both. The reader decides which axis they are optimising;
  // the tool should not decide it for them and then present the result as if
  // there were only one answer.
  Array.prototype.forEach.call(document.querySelectorAll(".prefs button"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".prefs button"),
        function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      pref = btn.dataset.pref;
      if (lastPlan) { renderPlan(lastPlan); }
    });
  });

  // Changing the window re-slices the curve already in memory. No fetch, no
  // routing -- that is the point of shipping the whole day in plans.json.
  [afterInput, beforeInput].forEach(function (el) {
    el.addEventListener("change", function () {
      if (lastPlan) { renderPlan(lastPlan); }
    });
  });

  fetch(DATA + "places.json").then(function (r) { return r.json(); }).then(function (places) {
    places.forEach(function (p) {
      [fromSel, toSel].forEach(function (sel) {
        var o = document.createElement("option");
        o.value = p.key; o.textContent = p.name;
        sel.appendChild(o);
      });
    });
    fromSel.value = "santa_fe";
    toSel.value = "los_alamos";
  });

  // Static mode has no router, so every ordered pair of places was routed
  // ahead of time and written into plans.json. Same payload either way, so
  // renderPlan does not know which mode it is in.
  var plansPromise = null;

  function planFor(from, to) {
    if (!STATIC) {
      return fetch(DATA + "plan.json?from=" + encodeURIComponent(from) +
                   "&to=" + encodeURIComponent(to));
    }
    if (!plansPromise) {
      plansPromise = fetch(DATA + "plans.json").then(function (r) { return r.json(); });
    }
    return plansPromise.then(function (all) {
      var plan = all[from + ">" + to];
      if (!plan) { throw new Error("No precomputed route for that pair."); }
      return plan;
    });
  }

  goBtn.addEventListener("click", function () {
    if (fromSel.value === toSel.value) {
      tripOut.innerHTML = '<div class="verdict">Pick two different places.</div>';
      return;
    }
    goBtn.disabled = true;
    goBtn.textContent = "Routing…";
    tripOut.innerHTML = "";

    planFor(fromSel.value, toSel.value)
      .then(function (r) { return r.json ? r.json() : r; })
      .then(function (plan) {
        if (plan.error) { throw new Error(plan.error); }
        lastPlan = plan;
        // The recommendation is risk-led, so the hour-of-day curve has to be
        // in hand before the first render rather than after it.
        return loadRisk().then(function () { renderPlan(plan); });
      })
      .catch(function (e) {
        tripOut.innerHTML = '<div class="verdict">' + e.message + "</div>";
      })
      .finally(function () {
        goBtn.disabled = false;
        goBtn.textContent = "Check departure times";
      });
  });

  function toMinutes(clock) {
    var bits = String(clock).split(":");
    return parseInt(bits[0], 10) * 60 + parseInt(bits[1] || "0", 10);
  }

  // Slicing a curve that was computed once, rather than routing again. A run
  // of this model takes hours, so nothing here can be computed per visitor --
  // plans.json carries the whole day and the window is applied in the browser.
  function summarise(options, from, to) {
    var inside = options.filter(function (o) {
      var m = toMinutes(o.depart);
      return m >= from && m < to;
    });
    if (!inside.length) { return null; }
    var best = inside.reduce(function (a, b) {
      return b.duration_min < a.duration_min ? b : a;
    });
    var worst = inside.reduce(function (a, b) {
      return b.duration_min > a.duration_min ? b : a;
    });
    // The model carries a fraction of real traffic, so it cannot tell 06:15
    // from 06:30 when they differ by forty seconds. Recommending one of them
    // would imply a precision it does not have.
    var tol = Math.max(1, best.duration_min * 0.05);
    var good = inside.filter(function (o) {
      return o.duration_min <= best.duration_min + tol;
    });
    // Risk per departure. The journey time barely moves across a day on these
    // corridors -- a minute or two -- while the chance of being killed moves
    // by a factor of nineteen. So the recommendation is risk-led, and the
    // minutes are the tie-breaker rather than the other way round.
    var hours = (risk && risk.summary && risk.summary.by_hour) || null;
    var safest = null, riskiest = null;
    if (hours) {
      inside.forEach(function (o) {
        var h = hours[Math.floor(toMinutes(o.depart) / 60) % 24];
        o.risk_x = h ? h.relative_risk : null;
        if (o.risk_x == null) { return; }
        if (!safest || o.risk_x < safest.risk_x) { safest = o; }
        if (!riskiest || o.risk_x > riskiest.risk_x) { riskiest = o; }
      });
    }

    return {
      inside: inside, best: best, worst: worst, good: good,
      goodSet: good.reduce(function (acc, o) { acc[o.depart] = true; return acc; }, {}),
      spread: worst.duration_min - best.duration_min,
      tol: tol,
      safest: safest, riskiest: riskiest
    };
  }

  // A bare "0.78x" says nothing without a referent. These are the words.
  function riskWords(x) {
    if (x == null) { return "not assessed"; }
    if (x < 0.5)  { return "safest time of day"; }
    if (x < 0.8)  { return "below average risk"; }
    if (x < 1.25) { return "about average risk"; }
    if (x < 2)    { return "above average risk"; }
    return "well above average risk";
  }

  function riskPhrase(x) {
    if (x == null) { return ""; }
    if (x >= 1.15) { return x.toFixed(1) + "\u00d7 the average hour"; }
    if (x <= 0.87) { return "about " + Math.round(100 / x) / 100 + "\u00d7 safer than average"; }
    return "about the average hour";
  }

  // "Best" needs a defined trade-off or it is a preference dressed as a fact,
  // and the order of the two tests is the whole trade-off. Filtering on time
  // first and then taking the safest survivor recommends midnight -- the
  // second-deadliest hour of the day -- because it is ninety seconds quicker.
  // Risk is the binding constraint here and time is the tie-breaker: take the
  // departures that are genuinely among the safest, then take the quickest of
  // those.
  var RISK_TOLERANCE = 1.25;

  function balancedPick(s) {
    var scored = s.inside.filter(function (o) { return o.risk_x != null; });
    if (!scored.length || !s.safest) { return s.best; }
    var ceiling = s.safest.risk_x * RISK_TOLERANCE;
    var safeEnough = scored.filter(function (o) { return o.risk_x <= ceiling; });
    if (!safeEnough.length) { return s.safest; }
    return safeEnough.reduce(function (a, b) {
      return b.duration_min < a.duration_min ? b : a;
    });
  }

  function pickCard(tag, option, chosen, note) {
    if (!option) { return ""; }
    return '<div class="pick' + (chosen ? " chosen" : "") + '">' +
      '<div><div class="tag">' + tag + '</div>' +
      '<div class="when">' + option.depart + "</div></div>" +
      '<div><div>' + option.duration_min.toFixed(0) + " min drive</div>" +
      '<div class="detail">' + (note || riskWords(option.risk_x)) + "</div></div>" +
      "</div>";
  }

  function renderPlan(plan) {
    var from = toMinutes(afterInput.value || "00:00");
    var to = toMinutes(beforeInput.value || "24:00");
    if (to <= from) {
      tripOut.innerHTML = '<div class="verdict">The end of the window has to ' +
        "be after its start.</div>";
      return;
    }
    var s = summarise(plan.options, from, to);
    if (!s) {
      tripOut.innerHTML = '<div class="verdict">The model has no departures ' +
        "in that range. It covers " + (plan.simulated || "the morning peak") +
        ".</div>";
      return;
    }

    // Scale the bars against the whole day, not the window, so a window is
    // visibly better or worse than the rest of the day rather than always
    // filling the panel.
    var max = Math.max.apply(null, plan.options.map(function (o) {
      return o.duration_min;
    }));
    // What the three numbers on this panel actually are, said once, in words.
    var html = '<div class="whatis">' +
      "<b>Drive time</b> is simulated and optimistic — this model carries 14% " +
      "of real traffic. <b>Risk</b> is measured: fatal crashes NHTSA recorded " +
      "on these roads since 2018, divided by how far people drove on them. " +
      "The multiplier compares one hour with an average hour of the day." +
      "</div>";

    var balanced = balancedPick(s);
    var chosenDepart = pref === "speed" ? s.best.depart
                     : pref === "safety" ? (s.safest || s.best).depart
                     : balanced.depart;

    html += '<div class="picks">' +
      pickCard("Fastest", s.best, pref === "speed",
               s.best.risk_x != null ? riskWords(s.best.risk_x) : null) +
      pickCard("Safest", s.safest, pref === "safety") +
      (balanced && s.safest && balanced.depart !== s.safest.depart
        ? pickCard("Best of both", balanced, pref === "both")
        : "") +
      "</div>";

    html += '<div class="bars">';
    plan.options.forEach(function (o) {
      var m = toMinutes(o.depart);
      var within = m >= from && m < to;
      var hot = o.risk_x != null && o.risk_x >= 2;
      html += '<div class="barrow' + (o.depart === chosenDepart ? " best" : "") +
                (within ? "" : " outside") + '">' +
                '<span class="t">' + o.depart + "</span>" +
                '<span class="b" style="width:' +
                  Math.max(2, Math.round((o.duration_min / max) * 84)) + 'px"></span>' +
                '<span class="m">' + o.duration_min.toFixed(0) + " min</span>" +
                (o.risk_x != null
                  ? '<span class="rx' + (hot ? " hot" : "") + '" title="' +
                    riskWords(o.risk_x) + '">' + o.risk_x.toFixed(1) + "\u00d7</span>"
                  : '<span class="rx"></span>') +
              "</div>";
    });
    html += "</div>";

    // The verdict follows whatever the reader said mattered, and says what
    // choosing it costs on the other axis.
    var chosen = s.inside.filter(function (o) { return o.depart === chosenDepart; })[0]
                 || s.best;
    var timeCost = chosen.duration_min - s.best.duration_min;
    var safer = (s.riskiest && chosen.risk_x)
      ? s.riskiest.risk_x / chosen.risk_x : null;

    html += '<div class="verdict">Leave at <b>' + chosen.depart + "</b> — " +
      chosen.duration_min.toFixed(0) + " min, " + riskWords(chosen.risk_x) + ".";
    if (pref !== "speed" && safer && safer > 1.3) {
      html += " That is about <b>" + safer.toFixed(1) + "\u00d7</b> safer per " +
        "kilometre than leaving at " + s.riskiest.depart +
        (timeCost > 0.5 ? ", and costs " + timeCost.toFixed(0) + " min more driving."
                        : ", and costs nothing in driving time.");
    } else if (pref === "speed" && s.spread < 3) {
      html += " Only " + s.spread.toFixed(0) + " min separates the best and " +
        "worst departure here, so speed is barely a reason to choose.";
    }
    if (plan.risk && plan.risk.per_billion_veh_km != null) {
      html += " On the roads this drive uses, <b>" +
        plan.risk.per_billion_veh_km.toFixed(1) + "</b> people have died per " +
        "billion km driven" +
        (plan.risk.assessed_share < 0.95
          ? "; " + Math.round((1 - plan.risk.assessed_share) * 100) +
            "% of the drive is on roads with no traffic count and could not " +
            "be assessed."
          : ".");
    }
    html += "</div>";
    tripOut.innerHTML = html;
  }

  function fmt(minutes) {
    var h = Math.floor(minutes / 60), m = minutes % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  fetch(DATA + (STATIC ? "map.geojson" : "data.geojson")).then(function (r) { return r.json(); }).then(function (d) {
    geo = d;
    draw();
    try {
      var b = layer.getBounds();
      if (b.isValid()) { map.fitBounds(b, { padding: [20, 20] }); }
    } catch (e) { /* keep the default view */ }
  });
})();
</script>
</body>
</html>
